<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1" font-family="sans-serif"><style>.t{font-size:14px;fill:#1a1a1a}.ts{font-size:12px;fill:#5f5e5a}</style><title id="t1">Stock buy and hold versus 50/50 demon in an alternating doubling and halving example</title><desc id="d1">Stock wealth returns to 1.0 every two periods. The 50/50 rebalanced portfolio compounds to about 3.25 by period 20.</desc><line x1="50" y1="60" x2="640" y2="60" stroke="#e1e0d9" stroke-width="1"/><line x1="50" y1="140" x2="640" y2="140" stroke="#e1e0d9" stroke-width="1"/><line x1="50" y1="220" x2="640" y2="220" stroke="#e1e0d9" stroke-width="1"/><line x1="50" y1="20" x2="50" y2="260" stroke="#c3c2b7" stroke-width="1"/><line x1="50" y1="260" x2="640" y2="260" stroke="#c3c2b7" stroke-width="1"/><text class="ts" x="40" y="64" text-anchor="end">3.0×</text><text class="ts" x="40" y="144" text-anchor="end">2.0×</text><text class="ts" x="40" y="224" text-anchor="end">1.0×</text><text class="ts" x="50" y="278" text-anchor="middle">0</text><text class="ts" x="197.5" y="278" text-anchor="middle">5</text><text class="ts" x="345" y="278" text-anchor="middle">10</text><text class="ts" x="492.5" y="278" text-anchor="middle">15</text><text class="ts" x="640" y="278" text-anchor="middle">20</text><text class="ts" x="345" y="296" text-anchor="middle">Period</text><line x1="50" y1="14" x2="74" y2="14" stroke="#888780" stroke-width="2" stroke-dasharray="6 4"/><text class="ts" x="82" y="18">Stock, buy and hold</text><line x1="240" y1="14" x2="264" y2="14" stroke="#185FA5" stroke-width="2.5"/><text class="ts" x="272" y="18">50/50 demon, rebalanced every period</text><polyline points="50,220 640,220" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="6 4"/><polyline points="50,220 109,210 168,198.8 227,186.1 286,171.9 345,155.8 404,137.8 463,117.5 522,94.7 581,69.1 640,40.2" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="640" cy="40.2" r="4" fill="#185FA5"/><circle cx="640" cy="220" r="4" fill="#888780"/><text class="t" x="648" y="44">3.25×</text><text class="ts" x="648" y="224">1.00×</text></svg>
